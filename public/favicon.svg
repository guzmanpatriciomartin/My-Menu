<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mi Menú">
  <!-- Lives in public/, which Vite copies to the root of dist/ untouched, so the same
       /favicon.svg path works under the dev server and under express.static(dist). -->
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <!-- QR finder pattern: the one shape that still reads as "scan me" at 16px. -->
  <rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
  <rect x="10.4" y="10.4" width="3.2" height="3.2" rx="0.6" fill="#f59e0b"/>
  <!-- Sparse modules, enough to suggest the rest of the code without turning to mud. -->
  <rect x="21.5" y="6.5" width="4" height="4" rx="1" fill="#f59e0b"/>
  <rect x="6.5" y="21.5" width="4" height="4" rx="1" fill="#f59e0b"/>
  <rect x="14.5" y="21.5" width="3" height="3" rx="0.8" fill="#f59e0b" opacity="0.75"/>
  <rect x="21.5" y="14.5" width="3" height="3" rx="0.8" fill="#f59e0b" opacity="0.75"/>
  <rect x="21.5" y="21.5" width="4" height="4" rx="1" fill="#f59e0b"/>
</svg>
